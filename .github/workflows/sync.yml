name: Deploy via SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # CRITICAL: fetch-depth: 0 is required to get git history for timestamp restoration
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Sync CNPC via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./world/customnpcs/scripts/ecmascript"
          remoteDir: "'/1. Cybercraft2069/world/customnpcs/scripts/ecmascript'"
          # Ensures only newer files are uploaded
          onlyNewer: true

          options: "--delete"
          
      - name: Sync KubeJS via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./kubejs"
          remoteDir: "'/1. Cybercraft2069/kubejs'"
          onlyNewer: true
          options: "--delete"

      - name: Sync datapack via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./world/datapacks"
          remoteDir: "'/1. Cybercraft2069/world/datapacks'"
          onlyNewer: true
          options: "--delete"
          
      - name: Sync TaczCyber via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./tacz/cyber_armorer/data/"
          remoteDir: "'/1. Cybercraft2069/tacz/cyber_armorer/data/'"
          onlyNewer: true
          options: "--delete"
          
      - name: Sync TaczDefault via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./tacz/tacz_default_gun/data/"
          remoteDir: "'/1. Cybercraft2069/tacz/tacz_default_gun/data/'"
          onlyNewer: true
          options: "--delete"

      - name: Sync server waypoints via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USERNAME }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: "./config/server_waypoint/waypoints/"
          remoteDir: "'/1. Cybercraft2069/config/server_waypoint/waypoints/'"
          onlyNewer: true
          options: "--delete"
